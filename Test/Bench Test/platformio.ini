; Group B -- bench test project (Pi<->ESP32 link, 9 SM sensors, 10 relays)
;
; Deliberately separate from Dual_Archi_Firmware. PlatformIO compiles every
; source file in src/, so a second setup()/loop() in that project's src/ would
; break the production build with a duplicate-symbol link error.
;
; Build/upload:   pio run -e nodemcu-32s -t upload
; Monitor:        pio device monitor -e nodemcu-32s

[env:nodemcu-32s]
platform  = espressif32
board     = nodemcu-32s
framework = arduino

monitor_speed   = 115200
monitor_filters = time, send_on_enter
; send_on_enter lets you type PING / SM / STATUS straight into the monitor
; and have it sent as a line -- handy before the Pi is wired up.

upload_speed = 921600
